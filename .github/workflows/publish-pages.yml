name: Publish Open Immersive Atlas (static)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: oia-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout public catalog and original labs
        uses: actions/checkout@v4
      - name: Configure static GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy newest public site
        id: deploy
        uses: actions/deploy-pages@v4
