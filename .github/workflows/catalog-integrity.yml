name: Catalog integrity / 目录完整性
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bilingual project schema and public-only URLs
        run: python3 scripts/validate_catalog.py
      - name: Validate standalone WebGL2 lab JavaScript syntax
        run: |
          node --check labs/terrain-lod/app.js
          node --check labs/terrain-lod/test-browser.mjs
      - name: Validate GLB inspector source and test syntax
        run: |
          node --check labs/glb-inspector/core.mjs
          node --check labs/glb-inspector/app.mjs
          node --check labs/glb-inspector/sample.mjs
          node --check labs/glb-inspector/test-core.mjs
          node --check labs/glb-inspector/test-browser.mjs
      - name: Run offline GLB structural regression tests
        run: node --test labs/glb-inspector/test-core.mjs
      - name: Validate original rendering-comparison lab syntax
        run: |
          node --check labs/renderer-compare/scene.mjs
          node --check labs/renderer-compare/renderers.mjs
          node --check labs/renderer-compare/app.mjs
          node --check labs/renderer-compare/test-core.mjs
          node --check labs/renderer-compare/timing.mjs
          node --check labs/renderer-compare/test-timing.mjs
          node --check labs/renderer-compare/test-browser.mjs
          node --check labs/renderer-compare/test-cdp-windows.cjs
      - name: Run shared WebGPU/WebGL2 geometry and clip tests
        run: node --test labs/renderer-compare/test-core.mjs labs/renderer-compare/test-timing.mjs
      - name: Validate original motion and tactics lab syntax
        run: |
          node --check labs/motion-qa/terrain.mjs
          node --check labs/motion-qa/kinematics.mjs
          node --check labs/motion-qa/combat.mjs
          node --check labs/motion-qa/tactics.mjs
          node --check labs/motion-qa/acceptance.mjs
          node --check labs/motion-qa/visual.mjs
          node --check labs/motion-qa/app.mjs
          node --check labs/motion-qa/test-core.mjs
          node --check labs/motion-qa/test-browser.mjs
      - name: Run deterministic motion, grounding, grip and NPC tests
        run: node --test labs/motion-qa/test-core.mjs
      - name: Validate normalized repository identities and license evidence
        run: python3 scripts/audit_repository_health.py
      - name: Validate independent first-party source radar
        run: python3 scripts/validate_source_radar.py
      - name: Validate five independent source-backed research lanes
        run: python3 scripts/validate_research_lanes.py
      - name: Check generated Markdown reproducibility
        run: |
          python3 scripts/build_catalog.py
          git diff --exit-code CATALOG.md
